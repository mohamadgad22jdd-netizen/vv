<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جوجه‌ی چاقو به دست</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#e0b93a">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efe6d6;--ink:#3b3226;--bubble:#fff8e1;--edge:#e0b93a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a251d;--ink:#f3e9d2;--bubble:#3a3326}}
:root[data-theme="dark"]{--bg:#2a251d;--ink:#f3e9d2;--bubble:#3a3326}
*{box-sizing:border-box}
body{margin:0;height:100%;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;overflow:hidden}
#chick{position:fixed;left:0;top:0;z-index:5;display:flex;align-items:flex-end;gap:8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;direction:rtl}
#chick.drag{cursor:grabbing}
.avatar{position:relative;width:110px;height:110px;flex:none}
#chick img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--edge);pointer-events:none;display:block}
#chick.drag img{transform:rotate(-6deg)}
.scar{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s}
#chick.hard img{border-color:#c0392b;filter:contrast(1.12) saturate(1.15)}
#chick.hard .scar{opacity:1;background:
  linear-gradient(105deg,transparent 44%,rgba(255,255,255,.9) 46%,rgba(255,255,255,.95) 48%,rgba(120,10,10,.55) 49%,transparent 51%),
  linear-gradient(115deg,transparent 60%,rgba(255,255,255,.75) 62%,rgba(120,10,10,.4) 63%,transparent 65%);
  box-shadow:inset 0 0 0 3px rgba(192,57,43,.65)}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.menu-card{background:var(--bubble);border:2px solid var(--edge);border-radius:18px;padding:26px 30px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.35);max-width:280px}
.menu-card h1{margin:0 0 18px;font-size:17px;line-height:1.7}
.diff{display:block;width:100%;margin:8px 0;padding:12px 10px;border-radius:12px;border:2px solid var(--edge);background:transparent;color:var(--ink);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,background .12s}
.diff:active{transform:scale(.96)}
.diff[data-d="easy"]:hover{background:rgba(120,190,120,.25)}
.diff[data-d="medium"]:hover{background:rgba(230,180,70,.25)}
.diff[data-d="hard"]:hover{background:rgba(210,80,70,.25)}
.hidden{display:none!important}
.bubble{background:var(--bubble);border:2px solid var(--edge);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:190px;font-size:14px;line-height:1.8}
.box{position:fixed;width:64px;height:64px;perspective:700px;pointer-events:none;z-index:1;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35))}
.box::after{content:'';position:absolute;left:50%;bottom:-10px;width:52px;height:14px;background:radial-gradient(ellipse,rgba(0,0,0,.35),rgba(0,0,0,0) 70%);transform:translateX(-50%);animation:shadowpulse 6s linear infinite}
@keyframes shadowpulse{0%,100%{opacity:.55}50%{opacity:.3}}
.box.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-25deg)}70%{transform:scale(1.18) rotate(6deg)}to{transform:scale(1) rotate(0)}}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin 7s linear infinite}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-6px}}
.cube i{position:absolute;inset:0;background-size:100% 100%,14px 14px;background-blend-mode:overlay;box-shadow:inset 0 0 0 3px rgba(40,20,5,.55),inset 0 14px 18px -6px rgba(255,255,255,.55),inset 0 -16px 20px -6px rgba(0,0,0,.5)}
.cube i::before{content:'';position:absolute;inset:6px;border:2px solid rgba(255,214,140,.55);box-shadow:inset 0 0 0 2px rgba(70,35,10,.5)}
.cube i::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9b8,#8a5a22 70%,#4a2c0d);box-shadow:inset 0 0 2px rgba(0,0,0,.6)}
.cube i:nth-child(1){transform:translateZ(32px);background-image:repeating-linear-gradient(90deg,#e0a35c 0 12px,#c9863e 12px 14px),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 8px)}
.cube i:nth-child(1)::after{top:6px;left:6px}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(32px);background-image:repeating-linear-gradient(90deg,#c9863e 0 12px,#b06f2e 12px 14px),repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 2px,transparent 2px 8px);filter:brightness(.75)}
.cube i:nth-child(2)::after{bottom:6px;right:6px}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(32px);background-image:repeating-linear-gradient(90deg,#d89452 0 12px,#bd7a3a 12px 14px),repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 2px,transparent 2px 8px);filter:brightness(.9)}
.cube i:nth-child(3)::after{top:6px;right:6px}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(32px);background-image:repeating-linear-gradient(90deg,#d89452 0 12px,#bd7a3a 12px 14px),repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 2px,transparent 2px 8px);filter:brightness(.65)}
.cube i:nth-child(4)::after{bottom:6px;left:6px}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(32px);background-image:repeating-linear-gradient(0deg,#f0c383 0 12px,#e0a35c 12px 14px);filter:brightness(1.12)}
.cube i:nth-child(5)::after{top:50%;left:50%;transform:translate(-50%,-50%)}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(32px);background-image:repeating-linear-gradient(0deg,#a9682c 0 12px,#8f5522 12px 14px);filter:brightness(.55)}
.cube i:nth-child(6)::after{top:50%;left:50%;transform:translate(-50%,-50%)}
.shard{position:fixed;pointer-events:none;z-index:2;background:linear-gradient(135deg,#e0a35c,#8f5522);border:1px solid #5a3313;box-shadow:inset 0 0 0 1px rgba(255,222,170,.4)}
.flash{position:fixed;pointer-events:none;z-index:3;border-radius:50%;background:radial-gradient(circle,rgba(255,235,180,.9),rgba(255,180,80,0) 70%);transform:translate(-50%,-50%)}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:15;display:flex;gap:8px;direction:rtl}
.stat{background:var(--bubble);border:2px solid var(--edge);border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;box-shadow:0 4px 10px rgba(0,0,0,.15);white-space:nowrap}
.stat b{font-weight:700}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-14px);z-index:25;background:var(--bubble);border:2px solid var(--edge);border-radius:14px;padding:12px 18px;font-weight:700;font-size:14px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.item{position:fixed;pointer-events:none;z-index:1;perspective:700px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35))}
.item.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.item-wrap{position:relative;width:100%;height:100%;animation:bob 2.2s ease-in-out infinite;transform-style:preserve-3d}
.item::after{content:'';position:absolute;left:50%;bottom:-8px;width:78%;height:12px;background:radial-gradient(ellipse,rgba(0,0,0,.35),rgba(0,0,0,0) 70%);transform:translateX(-50%);animation:shadowpulse 6s linear infinite}
.fruit-body{position:absolute;inset:6%;border-radius:50%;animation:spin2d 5s linear infinite;box-shadow:inset -8px -10px 16px rgba(0,0,0,.28),inset 6px 8px 14px rgba(255,255,255,.5)}
@keyframes spin2d{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.fruit-shine{position:absolute;top:14%;left:20%;width:26%;height:18%;background:rgba(255,255,255,.75);border-radius:50%;filter:blur(1px)}
.fruit-leaf{position:absolute;top:-6%;left:52%;width:26%;height:16%;background:#4a9c4a;border-radius:0 100% 0 100%;transform:rotate(-25deg);box-shadow:inset 0 0 0 1px rgba(0,60,0,.3)}
.fruit-stem{position:absolute;top:-10%;left:47%;width:8%;height:16%;background:#6b4423;border-radius:2px}
.item[data-fruit="watermelon"] .fruit-body{background:radial-gradient(circle at 35% 30%,#eafccb,#7fd85a 55%,#2f8f3f 82%,#1f6b2c);}
.item[data-fruit="watermelon"] .fruit-leaf,.item[data-fruit="watermelon"] .fruit-stem{display:none}
.item[data-fruit="watermelon"] .fruit-body::before{content:'';position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e8433f 70%,#c7302c);box-shadow:inset -6px -8px 12px rgba(0,0,0,.25)}
.seed{position:absolute;width:7%;height:11%;background:#2a2a2a;border-radius:50%}
</style>
</head>

function loadState(){try{const s=JSON.parse(localStorage.getItem('joojeSave'));if(s&&s.level){level=s.level;levelScore=s.levelScore;target=s.target;coins=s.coins;return true}}catch(e){}return false}
function updateHud(){lvlEl.textContent=level;scEl.textContent=levelScore;tgEl.textContent=target;coEl.textContent=coins;saveState()}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1600)}
const rnd=(a,b)=>a+Math.random()*(b-a);
function birdSound(){try{bird.currentTime=0;bird.play().catch(()=>{})}catch(e){}}
function crack(){try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const len=ac.sampleRate*.15,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=.3;s.buffer=buf;s.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
function draw(){el.style.transform=`translate(${x}px,${y}px)`}
function clamp(){x=Math.min(Math.max(0,x),W());y=Math.min(Math.max(0,y),H());draw()}
function freeSpot(){
  const c=el.getBoundingClientRect();
  for(let i=0;i<40;i++){
    const bx=rnd(10,Math.max(11,innerWidth-S-10)),by=rnd(10,Math.max(11,innerHeight-S-10));
    const away=bx>c.right+20||bx+S<c.left-20||by>c.bottom+20||by+S<c.top-20;
    if(away&&boxes.every(b=>Math.abs(b.x-bx)>S+10||Math.abs(b.y-by)>S+10))return{x:bx,y:by};
  }
  return{x:rnd(10,Math.max(11,innerWidth-S-10)),y:rnd(10,Math.max(11,innerHeight-S-10))};
}
function crateHTML(){
  return '<div class="item-wrap"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>';
}
function fruitHTML(v){
  let seeds='';
  if(v==='watermelon'){for(let i=0;i<5;i++){const a=rnd(0,360),r=rnd(10,26);seeds+=`<div class="seed" style="left:calc(50% + ${Math.cos(a*3.14/180)*r}%);top:calc(50% + ${Math.sin(a*3.14/180)*r}%)"></div>`}}
  return `<div class="item-wrap"><div class="fruit-stem"></div><div class="fruit-leaf"></div><div class="fruit-body">${seeds}</div><div class="fruit-shine"></div></div>`;
}
function spawn(){
  const p=freeSpot(),d=document.createElement('div'),theme=themeForLevel(level);
  let variant=null;
  if(theme==='crate'){d.className='item pop';d.innerHTML=crateHTML()}
  else{variant=FRUITS[Math.floor(Math.random()*FRUITS.length)];d.className='item pop';d.setAttribute('data-fruit',variant);d.innerHTML=fruitHTML(variant)}
  d.style.width=S+'px';d.style.height=S+'px';
  d.style.left=p.x+'px';d.style.top=p.y+'px';document.body.appendChild(d);
  boxes.push({el:d,x:p.x,y:p.y,theme,variant});
}
function clearItems(){boxes.forEach(b=>b.el.remove());boxes=[]}
function levelUp(){
  const bonus=Math.round(rnd(5,15));
  coins+=bonus;level++;levelScore=0;target=10+(level-1)*5;
  updateHud();
  toast(`🎉 مرحله قبل تموم شد! +${bonus} سکه`);
  clearItems();
  for(let i=0;i<N;i++)spawn();
}
function breakBox(b){
  boxes=boxes.filter(o=>o!==b);b.el.remove();crack();
  const cx=b.x+S/2,cy=b.y+S/2;
  const cols=b.theme==='fruit'?FRUIT_COLORS[b.variant]:['#e0a35c','#8f5522'];
  const fl=document.createElement('div');fl.className='flash';
  fl.style.left=cx+'px';fl.style.top=cy+'px';fl.style.width='10px';fl.style.height='10px';document.body.appendChild(fl);
  fl.animate([{width:'10px',height:'10px',opacity:1},{width:'90px',height:'90px',opacity:0}],
    {duration:260,easing:'ease-out'}).onfinish=()=>fl.remove();
  for(let i=0;i<16;i++){
    const s=document.createElement('div');s.className='shard';
    s.style.background=`linear-gradient(135deg,${cols[0]},${cols[1]})`;
    s.style.borderRadius=b.theme==='fruit'?'50%':'0';
    const sz=rnd(5,13);s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.left=cx-sz/2+'px';s.style.top=cy-sz/2+'px';document.body.appendChild(s);
    const a=Math.random()*6.28,r=rnd(60,160),rot0=rnd(0,360);
    s.style.transform=`rotate(${rot0}deg)`;
    s.animate([{transform:`translate(0,0) rotate(${rot0}deg)`,opacity:1},
      {transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r+60}px) rotate(${rot0+rnd(-420,420)}deg)`,opacity:0}],
      {duration:rnd(600,900),easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>s.remove();
  }
  levelScore++;updateHud();
  if(levelScore>=target){levelUp()}else{setTimeout(spawn,500+Math.random()*400)}
}
function hitCheck(){
  const r=img.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,rad=r.width/2;
  for(const b of boxes.slice()){
    const nx=Math.min(Math.max(cx,b.x),b.x+S),ny=Math.min(Math.max(cy,b.y),b.y+S);
    if((cx-nx)**2+(cy-ny)**2<rad*rad){breakBox(b);vx*=.85;vy*=.85}
  }
}
function fly(t){
  const dt=Math.min((t-last)/16.67,3);last=t;
  x+=vx*dt;y+=vy*dt;
  if(x<0){x=0;vx=-vx*.75}else if(x>W()){x=W();vx=-vx*.75}
  if(y<0){y=0;vy=-vy*.75}else if(y>H()){y=H();vy=-vy*.75}
  const f=Math.pow(.985,dt);vx*=f;vy*=f;
  draw();hitCheck();
  raf=Math.hypot(vx,vy)>.3?requestAnimationFrame(fly):0;
}
el.addEventListener('pointerdown',e=>{
  cancelAnimationFrame(raf);raf=0;
  const bub=el.querySelector('.bubble');
  if(bub){const w=el.offsetWidth;bub.remove();x+=w-el.offsetWidth;clamp()}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(_){}
  el.setPointerCapture(e.pointerId);el.classList.add('drag');
  dx=e.clientX-x;dy=e.clientY-y;hist=[{x:e.clientX,y:e.clientY,t:performance.now()}]});
el.addEventListener('pointermove',e=>{
  if(!el.classList.contains('drag'))return;
  x=e.clientX-dx;y=e.clientY-dy;clamp();
  const n=performance.now();hist.push({x:e.clientX,y:e.clientY,t:n});
  while(hist.length>2&&n-hist[0].t>100)hist.shift();
  const a=hist[0],b=hist[hist.length-1],sp=b.t>a.t?Math.hypot(b.x-a.x,b.y-a.y)/(b.t-a.t)*16.67:0;
  if(sp>8)hitCheck()});
function release(){
  if(!el.classList.contains('drag'))return;
  el.classList.remove('drag');
  const n=performance.now(),a=hist[0],b=hist[hist.length-1],span=b.t-a.t;
  if(span>0&&n-b.t<80){vx=(b.x-a.x)/span*16.67;vy=(b.y-a.y)/span*16.67;
    const s=Math.hypot(vx,vy);if(s>60){vx*=60/s;vy*=60/s}}
  else{vx=vy=0}
  const sp=Math.hypot(vx,vy);
  if(sp>4)birdSound();
  if(sp>.3){last=performance.now();raf=requestAnimationFrame(fly)}
}
el.addEventListener('pointerup',release);
el.addEventListener('pointercancel',release);
addEventListener('resize',()=>{clamp();boxes.forEach(b=>{b.x=Math.min(b.x,Math.max(0,innerWidth-S));b.y=Math.min(b.y,Math.max(0,innerHeight-S));b.el.style.left=b.x+'px';b.el.style.top=b.y+'px'})});
function startGame(diff){
  document.getElementById('menu').classList.add('hidden');
  el.style.display='flex';
  hud.classList.remove('hidden');
  if(diff==='easy')S=64;
  else if(diff==='medium')S=48;
  else S=14;
  el.classList.toggle('hard',diff==='hard');
  if(!loadState()){level=1;levelScore=0;target=10;coins=0}
  updateHud();
  x=W()-16;y=H()-16;clamp();
  for(let i=0;i<N;i++)spawn();
}
document.querySelectorAll('.diff').forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.d)));
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
